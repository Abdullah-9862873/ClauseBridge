[project]
name = "clausebridge-api"
version = "1.0.0"
description = "ClauseBridge backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
]
[tool.ruff]
line-length = 88
[tool.mypy]
strict = true
python_version = "3.13"